<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main>
        <section class="top">
            <div id="searchTask" class="form">
                <label>
                    <input id="searchInput" type="text" placeholder="Search task"/>
                </label>
                <button id="searchButton" class="button" ><img src="src/magnifier_white.png"></button>
                <button id="createTaskButton" class="button"><img src="src/plus.svg"></button>
            </div>
            <div class="modal" id="formModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modal-text">Add new task</h3>
                        <button id="modal-close" class="modal-close">&times;</button>
                    </div>

                    <div class="modal-body">
                        <div class="input-group">
                            <input id="taskInput" type="text" placeholder="Add task" required />
                            <button id="addButton" class="button" type="submit">Add</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section id="taskToDo" class="tasks">
            <p>Task to do - <span id="taskCount">0</span></p>
            <div id="tasksContainer" class="tasksContainer">
            </div>
        </section>
        <section id="doneTasks" class="tasks">
            <p>Done - <span id="doneCount">0</span></p>
            <div id="doneTasksContainer" class="tasksContainer">
            </div>
        </section>
    </main>
    <button id='theme' class="switch" data-switch-dark aria-hidden></button>
</body>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="js/script.js"></script>
<script src="js/modal.js"></script>
<script src="js/search.js"></script>
<script src="js/editTask.js"></script>
<script src="js/createTask.js"></script>
</html>
